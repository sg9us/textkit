<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
  const allowedOrigins = new Set(['https://sg9us.github.io', 'http://localhost:8771']);
  window.top.postMessage({ source: 'textkit-voc-bridge', kind: 'ready' }, '*');
  window.addEventListener('message', event => {
      if (!allowedOrigins.has(event.origin) || event.data?.source !== 'textkit-voc-client') return;
      const parentOrigin = event.origin;
      const { id, method, payload } = event.data;
      if (!Number.isSafeInteger(id) || !['list', 'submit'].includes(method)) return;
      const run = google.script.run
        .withSuccessHandler(result => window.top.postMessage({ source: 'textkit-voc-bridge', id, ok: true, result }, parentOrigin))
        .withFailureHandler(error => window.top.postMessage({ source: 'textkit-voc-bridge', id, ok: false, error: String(error?.message || error) }, parentOrigin));
      if (method === 'list') run.listVoc(); else run.submitVoc(payload);
  });
</script>
</body></html>
